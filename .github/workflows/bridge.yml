name: Build Windows bridge
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/bridge/**'
      - 'src/windows/**'
      - 'src/tests/**'
      - 'src/tools/**'
      - 'src/licenses/**'
      - 'src/requirements-dev.txt'
      - '.github/workflows/bridge.yml'
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r src/requirements-dev.txt
      - run: ./src/tools/build_release.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: VColor-OpenRGB-Bridge-Windows-x64
          path: bin/
